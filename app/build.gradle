plugins { id 'com.android.application' }
android {
    namespace 'com.flappybro.skyline'
    compileSdk 35
    defaultConfig {
        applicationId 'com.flappybro.skyline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.flappybro.skyline.SmokeTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '' } }
}
